[project]
name = "ha-prodigy-bed"
version = "0.1.0"
description = "Home Assistant integration for Prodigy beds via an ESPHome bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioesphomeapi>=31.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.11",
]
