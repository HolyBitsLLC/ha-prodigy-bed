name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check custom_components tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - run: pytest --cov=custom_components/prodigy_bed --cov-report=xml tests/
      - uses: codecov/codecov-action@v4
        if: always()

  hassfest:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  validate:
    name: Validate Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("custom_components/prodigy_bed/manifest.json"),
              Path("custom_components/prodigy_bed/strings.json"),
              Path("custom_components/prodigy_bed/translations/en.json"),
              Path("hacs.json"),
              Path("release-please-config.json"),
              Path(".release-please-manifest.json"),
          ):
              json.loads(path.read_text())
          PY
      - name: Validate Python syntax
        run: python -m py_compile custom_components/prodigy_bed/*.py tests/*.py

  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
